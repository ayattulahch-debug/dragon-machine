<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Machine — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .login-header {
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
        .icon-circle {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem; color: #fff;
        }
        .login-body { padding: 0 2rem 2rem; }
        .btn-login {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none; padding: 0.7rem; font-weight: 600; font-size: 1rem;
        }
        .btn-login:hover { background: linear-gradient(135deg, #0284c7, #1d4ed8); }
        .form-control:focus { border-color: #0ea5e9; box-shadow: 0 0 0 2px rgba(14,165,233,0.25); }
        .label-small { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="icon-circle"><i class="bi bi-dragon"></i></div>
            <h4 class="text-white fw-bold mb-1">Dragon Machine</h4>
            <p class="text-secondary small mb-0">Sistem Manajemen Bahan & Reagen</p>
        </div>
        <div class="login-body">
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <div class="label-small"><i class="bi bi-person me-1"></i>Username</div>
                    <input type="text" class="form-control" id="input-username" placeholder="Masukkan username" required autocomplete="username">
                </div>
                <div class="mb-4">
                    <div class="label-small"><i class="bi bi-lock me-1"></i>Password</div>
                    <input type="password" class="form-control" id="input-password" placeholder="Masukkan password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100" id="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-secondary">
                    <i class="bi bi-shield-lock me-1"></i>
                    Hubungi administrator jika lupa password
                </small>
            </div>
        </div>
    </div>
    <script>
        if (localStorage.getItem('token')) {
            window.top.location.href = '/';
        }

        function handleLogin(e) {
            e.preventDefault();
            var username = document.getElementById('input-username').value.trim();
            var password = document.getElementById('input-password').value;
            var btn = document.getElementById('btn-login');

            if (!username || !password) {
                Swal.fire('Perhatian', 'Username dan Password wajib diisi!', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memverifikasi...';

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ args: [username, password] })
            })
            .then(function(r) { return r.json(); })
            .then(function(resp) {
                if (resp.token) {
                    localStorage.setItem('token', resp.token);
                    localStorage.setItem('userRole', resp.user.role);
                    localStorage.setItem('userName', resp.user.nama);
                    localStorage.setItem('userUsername', resp.user.username);
                    localStorage.setItem('userPermissions', JSON.stringify(resp.user.permissions || []));
                    Swal.fire({
                        icon: 'success',
                        title: 'Welcome, dragon hunters',
                        html: 'Selamat datang, <b>' + resp.user.nama + '</b><br><span class="badge bg-info">' + resp.user.role + '</span>',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(function() {
                        window.top.location.href = '/';
                    });
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk';
                    Swal.fire('Login Gagal', resp.error || 'Username atau Password salah!', 'error');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk';
                Swal.fire('Error', 'Terjadi kesalahan server: ' + err.message, 'error');
            });
        }
    </script>
</body>
</html>
